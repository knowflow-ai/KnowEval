# 被测系统：KnowFlow（沿用 RAGFlow 的 /api/v1 接口）。命令行 knoweval run 用；评测台在「系统」页接入，不用这个文件。
# 在 Docker 里跑时，本机上的服务要写 host.docker.internal（容器里的 localhost 是容器自己）。
adapter: knowflow
base_url: http://host.docker.internal:9380
api_key_env: KNOWFLOW_API_KEY
# 回答正文里的图是 /minio/... 相对地址，由网页端口的 nginx 提供，API 端口取不到。
# 填 KnowFlow 的网页地址；不填则图文答案核对拿不到图片哈希。
image_base_url: http://host.docker.internal
version: "2.6.1"
# 建库走前端接口 /v1/kb/create（见 KnowflowAdapter），必须写明嵌入模型
dataset:
  chunk_method: smart
  embedding_model: BAAI/bge-m3@SILICONFLOW
  language: Chinese
  parser_config:
    layout_recognize: MinerU
chat: {}
concurrency: 4
ask_timeout_s: 180
ingest_timeout_s: 3600
