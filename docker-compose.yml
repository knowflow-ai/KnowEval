# KnowEval 评测台
#
#   启动：./start.sh        （或 docker compose up -d --build）
#   体验：./start.sh demo   （同时启动内置的演示 RAG 服务，没有自己的 RAG 系统也能跑通）
#   打开：http://127.0.0.1:8780
#
# 数据都在 ./workspace：系统接入、模型设置、测试集、评测结果。API Key 写在 .env 里（见 .env.example）。

services:
  knoweval:
    build: .
    image: knoweval:local
    container_name: knoweval
    restart: unless-stopped
    # 评测台没有登录：默认只映射到本机 127.0.0.1。要从别的机器访问，在 .env 里设 KNOWEVAL_BIND=0.0.0.0，并自行加访问控制
    ports:
      - "${KNOWEVAL_BIND:-127.0.0.1}:${KNOWEVAL_PORT:-8780}:8780"
    volumes:
      - ./workspace:/workspace
    # 短写法各版本 Compose 都认；.env 由 ./start.sh 从 .env.example 生成，直接用 docker compose 前先 cp .env.example .env
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      # 内置演示服务的地址（只有 --profile demo 时才会起这个服务）
      KNOWEVAL_DEMO_RAG_URL: http://demo-rag:18790
      MOCK_RAG_API_KEY: demo
    # 被测系统跑在宿主机上（比如本机的 KnowFlow）时，在评测台里把地址写成 http://host.docker.internal:9380
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 内置演示 RAG：按段落切分、按词重叠挑段落，只用来演示接口和流程
  demo-rag:
    profiles: ["demo"]
    image: knoweval:local
    container_name: knoweval-demo-rag
    restart: unless-stopped
    entrypoint: ["python", "/app/examples/mock_rag_server.py", "--host", "0.0.0.0", "--port", "18790"]
    environment:
      MOCK_RAG_API_KEY: demo
    # 镜像自带的健康检查探的是评测台的 8780 端口，这里换成探演示服务自己的端口
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 18790), timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - knoweval
